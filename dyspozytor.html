<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER FLEET - Panel Dyspozytora</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050811">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #050811; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .cyber-card { background: rgba(13, 19, 33, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.25); }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col justify-between">

  <!-- TOP FLEET CONTROL BAR -->
  <header class="cyber-card p-4 rounded-xl mb-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-cyan-400 hover:text-white transition"><i class="fa-solid fa-house"></i></a>
      <i class="fa-solid fa-headset text-cyan-400 text-2xl"></i>
      <div>
        <h1 class="font-orbitron text-lg font-bold text-cyan-400">DISPATCHER COMMAND CENTER</h1>
        <p class="text-xs text-gray-400">Zarządzanie Trasami, Frachtem i Kalkulator Rentowności</p>
      </div>
    </div>
    <div class="flex gap-6 text-center">
      <div>
        <span class="block text-xs text-gray-400">FLOTA W BAZIE</span>
        <span id="dispatcher-fleet-count" class="font-orbitron text-xl font-bold text-emerald-400">0</span>
      </div>
      <div>
        <span class="block text-xs text-gray-400">SUMA FRACHTÓW</span>
        <span id="dispatcher-total-money" class="font-orbitron text-xl font-bold text-amber-400">0 PLN</span>
      </div>
    </div>
  </header>

  <!-- MAIN DISPATCHER GRID -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-grow">
    
    <!-- LEFT: ROUTE CREATOR & MONEY CALCULATOR (1 COL) -->
    <section class="cyber-card p-4 rounded-xl border-amber-500/30 flex flex-col justify-between">
      <div>
        <h2 class="font-orbitron text-sm text-amber-400 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-calculator"></i> DODAJ TRASĘ I OBLICZ KASĘ
        </h2>

        <form id="form-add-route" class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-400">Punkt Startowy</label>
              <input type="text" id="route-from" placeholder="np. Poznań" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-cyan-300">
            </div>
            <div>
              <label class="block text-[10px] text-gray-400">Punkt Docelowy</label>
              <input type="text" id="route-to" placeholder="np. Warszawa" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-cyan-300">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[10px] text-gray-400">Dystans (km)</label>
              <input type="number" id="route-distance" placeholder="np. 310" min="1" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-amber-300 font-mono">
            </div>
            <div>
              <label class="block text-[10px] text-gray-400">Stawka za km (PLN)</label>
              <input type="number" step="0.1" id="route-rate" placeholder="np. 4.50" required class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-amber-300 font-mono">
            </div>
          </div>

          <!-- LIVE CALCULATED FINANCES -->
          <div class="p-3 bg-black/60 rounded border border-amber-500/40 text-center my-2">
            <span class="block text-[10px] text-gray-400 uppercase tracking-wider">Przewidywany Wartość Frachtu</span>
            <span id="calculated-total-val" class="font-orbitron text-2xl font-black text-amber-400">0.00 PLN</span>
          </div>

          <div>
            <label class="block text-[10px] text-gray-400">Przypisz Kierowcę i Auto</label>
            <select id="route-assign-driver" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-cyan-300">
              <!-- Wypełniane dynamicznie -->
            </select>
          </div>

          <button type="submit" class="w-full py-3 bg-amber-950 hover:bg-amber-900 text-amber-300 font-orbitron text-xs font-bold rounded border border-amber-600 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-route"></i> ZATWIERDŹ I WYŚLIJ TRASĘ
          </button>
        </form>
      </div>
    </section>

    <!-- RIGHT: FLEET MAP & ACTIVE ROUTES (2 COLS) -->
    <section class="lg:col-span-2 flex flex-col gap-4">
      <div class="cyber-card p-3 rounded-xl min-h-[250px] flex flex-col">
        <h2 class="font-orbitron text-xs text-cyan-400 mb-2"><i class="fa-solid fa-earth-europe mr-1"></i> PODGLĄD MAPY GPS</h2>
        <div id="fleet-map" class="w-full h-full rounded-lg border border-cyan-900/50"></div>
      </div>

      <div class="cyber-card p-4 rounded-xl">
        <h2 class="font-orbitron text-xs text-cyan-400 mb-3"><i class="fa-solid fa-truck-ramp-box mr-1"></i> AKTYWNE TRASY I FRACHTY</h2>
        <div id="routes-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- Lista wygenerowanych tras z przeliczoną kasą -->
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.cyberApp.initDispatcherPanel();
    });
  </script>
</body>
</html>
