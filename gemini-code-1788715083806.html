<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER FLEET - Panel Dyspozytora</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050811">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #050811; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .cyber-card { background: rgba(13, 19, 33, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.25); }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col justify-between">

  <!-- TOP FLEET CONTROL BAR -->
  <header class="cyber-card p-4 rounded-xl mb-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-cyan-400 hover:text-white transition"><i class="fa-solid fa-house"></i></a>
      <i class="fa-solid fa-headset text-cyan-400 text-2xl"></i>
      <div>
        <h1 class="font-orbitron text-lg font-bold text-cyan-400">DISPATCHER COMMAND CENTER</h1>
        <p class="text-xs text-gray-400">Podgląd Floty & Operacje w Czasie Rzeczywistym</p>
      </div>
    </div>
    <div class="flex gap-6 text-center">
      <div>
        <span class="block text-xs text-gray-400">AKTYWNE POJAZDY</span>
        <span class="font-orbitron text-xl font-bold text-emerald-400">12 / 12</span>
      </div>
      <div>
        <span class="block text-xs text-gray-400">ALERTY DMS</span>
        <span class="font-orbitron text-xl font-bold text-red-500">0</span>
      </div>
    </div>
  </header>

  <!-- DISPATCHER DASHBOARD GRID -->
  <main class="grid grid-cols-1 lg:grid-cols-3 gap-4 flex-grow">
    
    <!-- FLEET MONITORING MAP (2 COLS) -->
    <section class="lg:col-span-2 cyber-card p-3 rounded-xl flex flex-col min-h-[400px]">
      <h2 class="font-orbitron text-xs text-cyan-400 mb-2"><i class="fa-solid fa-earth-europe mr-1"></i> MONITOROWANIE FLOTY GPS</h2>
      <div id="fleet-map" class="w-full h-full rounded-lg border border-cyan-900/50"></div>
    </section>

    <!-- LIVE LOGISTICS & e-CMR FEED -->
    <section class="flex flex-col gap-4">
      <div class="cyber-card p-4 rounded-xl flex-grow">
        <h2 class="font-orbitron text-xs text-cyan-400 mb-3"><i class="fa-solid fa-list-check mr-1"></i> OSTRZEŻENIA I ZGŁOSZENIA e-CMR</h2>
        <div id="dispatcher-feed" class="space-y-3 text-xs">
          <div class="p-2.5 rounded bg-cyan-950/40 border border-cyan-800/50">
            <div class="flex justify-between font-bold text-cyan-300">
              <span>Ciężarówka #01 (Jan Kowalski)</span>
              <span class="text-[10px] text-gray-400">10 min temu</span>
            </div>
            <p class="text-gray-400 mt-1">Wjechano do strefy Geofence: Centrum Poznań.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.cyberApp.initDispatcherPanel();
    });
  </script>
</body>
</html>
