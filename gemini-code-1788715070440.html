<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER FLEET - Wybór Panelu</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050811">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #050811; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .cyber-card { background: rgba(13, 19, 33, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.25); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full cyber-card p-6 rounded-2xl text-center shadow-2xl border border-cyan-500/30">
    <div class="mb-4 text-cyan-400 text-4xl">
      <i class="fa-solid fa-truck-fast"></i>
    </div>
    <h1 class="font-orbitron text-2xl font-bold text-cyan-400 mb-1">CYBER FLEET</h1>
    <p class="text-xs text-gray-400 mb-6">System Telematyczny i Zintegrowany HUD</p>
    
    <div class="flex flex-col gap-4">
      <a href="kierowca.html" class="py-3 px-4 bg-cyan-950/80 hover:bg-cyan-900 border border-cyan-500/60 rounded-xl font-orbitron text-cyan-300 font-bold transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-gauge-high"></i> TERMINAL KIEROWCY (HUD)
      </a>
      <a href="dyspozytor.html" class="py-3 px-4 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl font-orbitron text-gray-300 font-bold transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-headset"></i> PANEL DYSPOZYTORA
      </a>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
      });
    }
  </script>
</body>
</html>
