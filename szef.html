<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER FLEET - Panel Szefa / Admin</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#050811">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #050811; color: #e2e8f0; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .cyber-card { background: rgba(13, 19, 33, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.25); }
  </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="cyber-card p-4 rounded-xl mb-6 flex justify-between items-center border-amber-500/30">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-amber-400 hover:text-white transition"><i class="fa-solid fa-house"></i></a>
      <i class="fa-solid fa-user-shield text-amber-400 text-2xl"></i>
      <div>
        <h1 class="font-orbitron text-lg font-bold text-amber-400">ADMIN / FLEET MANAGER</h1>
        <p class="text-xs text-gray-400">Zarządzanie Pojazdami, Kierowcami i Uprawnieniami</p>
      </div>
    </div>
    <div class="text-right">
      <span class="block text-[10px] text-gray-400 font-mono">TRYB ZARZĄDZANIA</span>
      <span class="font-orbitron text-xs text-amber-400 font-bold"><i class="fa-solid fa-lock mr-1"></i> SZEF OPERACYJNY</span>
    </div>
  </header>

  <!-- MAIN ADMIN CONTENT -->
  <main class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
    
    <!-- ZARZĄDZANIE FLOTĄ (DODAWANIE TIR-ÓW) -->
    <section class="cyber-card p-5 rounded-xl border-cyan-500/30 flex flex-col justify-between">
      <div>
        <h2 class="font-orbitron text-sm text-cyan-400 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-truck-front"></i> DODAJ NOWY POJAZD DO FLOTY
        </h2>
        
        <form id="form-add-truck" class="space-y-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Numer Rejestracyjny (ID Pojazdu)</label>
            <input type="text" id="truck-reg" placeholder="np. PO 883XW" required class="w-full bg-slate-900 border border-cyan-800 rounded-lg p-2.5 text-sm text-cyan-300 focus:outline-none focus:border-cyan-400 font-mono">
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Marka i Model Ciężarówki</label>
            <input type="text" id="truck-model" placeholder="np. Volvo FH16 750 / Scania R500" required class="w-full bg-slate-900 border border-cyan-800 rounded-lg p-2.5 text-sm text-cyan-300 focus:outline-none focus:border-cyan-400">
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Status Techniczny / Typ Zestawu</label>
            <select id="truck-type" class="w-full bg-slate-900 border border-cyan-800 rounded-lg p-2.5 text-sm text-cyan-300 focus:outline-none focus:border-cyan-400">
              <option value="Ciągnik + Naczepa Standard">Ciągnik + Naczepa Standard (13.6m)</option>
              <option value="Ciągnik + Chłodnia">Ciągnik + Chłodnia</option>
              <option value="Zestaw Przestrzenny / BDF">Zestaw Przestrzenny / BDF</option>
              <option value="Solówka">Solówka / Dystrybucja</option>
            </select>
          </div>

          <button type="submit" class="w-full py-3 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 font-orbitron text-xs font-bold rounded-lg border border-cyan-600 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-plus"></i> ZAREJESTRUJ POJAZD W BAZIE
          </button>
        </form>
      </div>

      <!-- LISTA POJAZDÓW -->
      <div class="mt-6 border-t border-slate-800 pt-4">
        <h3 class="font-orbitron text-xs text-gray-400 mb-3">ZAREJESTROWANE POJAZDY FLOTY</h3>
        <div id="trucks-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- Wypełniane dynamicznie przez app.js -->
        </div>
      </div>
    </section>

    <!-- ZARZĄDZANIE KIEROWCAMI I PIN-AMI -->
    <section class="cyber-card p-5 rounded-xl border-amber-500/30 flex flex-col justify-between">
      <div>
        <h2 class="font-orbitron text-sm text-amber-400 mb-4 flex items-center gap-2">
          <i class="fa-solid fa-id-card"></i> DODAJ KIEROWCĘ I PRZYPISZ PIN
        </h2>
        
        <form id="form-add-driver" class="space-y-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Imię i Nazwisko Kierowcy</label>
            <input type="text" id="driver-name" placeholder="np. Jan Kowalski" required class="w-full bg-slate-900 border border-amber-900 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-500">
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Kod PIN Kierowcy (do logowania w terminalu)</label>
            <input type="password" maxlength="4" id="driver-pin" placeholder="****" required class="w-full bg-slate-900 border border-amber-900 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-500 font-mono tracking-widest">
          </div>

          <div>
            <label class="block text-xs text-gray-400 mb-1">Domyślnie Przypisany Pojazd</label>
            <select id="driver-assigned-truck" class="w-full bg-slate-900 border border-amber-900 rounded-lg p-2.5 text-sm text-amber-300 focus:outline-none focus:border-amber-500">
              <!-- Wypełniane dynamicznie przez app.js -->
            </select>
          </div>

          <button type="submit" class="w-full py-3 bg-amber-950 hover:bg-amber-900 text-amber-300 font-orbitron text-xs font-bold rounded-lg border border-amber-600 transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-user-plus"></i> UTWÓRZ KONTO KIEROWCY
          </button>
        </form>
      </div>

      <!-- LISTA KIEROWCÓW -->
      <div class="mt-6 border-t border-slate-800 pt-4">
        <h3 class="font-orbitron text-xs text-gray-400 mb-3">LISTA KIEROWCÓW I AKTYWNE PIN-Y</h3>
        <div id="drivers-list" class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <!-- Wypełniane dynamicznie przez app.js -->
        </div>
      </div>
    </section>

  </main>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.cyberApp.initBossPanel();
    });
  </script>
</body>
</html>
