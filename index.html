<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRUCKER PRO ENTERPRISE v5.0</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Style i Biblioteki -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: 'Rajdhani', sans-serif; background: #030712; color: #f3f4f6; touch-action: manipulation; }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .glass-card { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(16, 185, 129, 0.2); }
    .tab-btn.active { background-color: rgba(16, 185, 129, 0.2); border-color: #10b981; color: #34d399; box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }
    #map { height: 350px; width: 100%; border-radius: 1rem; border: 1px solid rgba(16, 185, 129, 0.2); }
    input, select, textarea { background-color: #0b0f19 !important; border-color: #1e293b !important; color: #f3f4f6 !important; }
    input:focus, select:focus, textarea:focus { border-color: #10b981 !important; outline: none; }
    
    /* Dynamiczne widoki RBAC */
    body.role-driver .boss-only, body.role-driver .dispatcher-only { display: none !important; }
    body.role-dispatcher .boss-only { display: none !important; }
    body.role-boss .driver-only { display: none !important; }
  </style>
</head>
<body class="p-2 md:p-4 min-h-screen flex flex-col justify-between role-boss">

  <!-- SYSTEM TOASTÓW / POWIADOMIEŃ -->
  <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <!-- MODAL AUTORYZACJI PIN -->
  <div id="pin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card p-6 rounded-2xl max-w-sm w-full border-emerald-500/50 text-center space-y-4">
      <div class="w-12 h-12 bg-emerald-950 border border-emerald-500 rounded-full flex items-center justify-center mx-auto text-emerald-400 text-xl">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <div>
        <h3 class="font-orbitron text-lg font-bold text-white">AUTORYZACJA ROLI</h3>
        <p class="text-xs text-gray-400 mt-1">Wprowadź PIN (Domyślny Szefa: 1234, Dyspozytora: 5555)</p>
      </div>
      <input type="password" id="pin-input" maxlength="4" placeholder="****" class="w-full text-center text-2xl font-mono tracking-widest rounded-xl p-3 border-emerald-500">
      <div class="grid grid-cols-2 gap-2">
        <button onclick="closePinModal()" class="py-2.5 bg-slate-900 border border-slate-700 text-gray-300 font-orbitron text-xs rounded-xl">ANULUJ</button>
        <button onclick="verifyPin()" class="py-2.5 bg-emerald-600 hover:bg-emerald-500 text-black font-orbitron font-bold text-xs rounded-xl">ZALOGUJ</button>
      </div>
    </div>
  </div>

  <!-- HEADER SYSTEMOWY -->
  <header class="glass-card p-3 rounded-2xl mb-3 flex flex-wrap justify-between items-center gap-2">
    <div class="flex items-center gap-3">
      <i class="fa-solid fa-truck-fast text-emerald-400 text-3xl"></i>
      <div>
        <h1 class="font-orbitron text-base font-black text-emerald-400 tracking-wider">TRUCKER PRO <span class="text-[10px] bg-emerald-950 border border-emerald-500 text-emerald-300 px-1.5 py-0.5 rounded ml-1">v5.0 ENTERPRISE</span></h1>
        <p class="text-[10px] text-gray-400 font-mono" id="status-mode-label">AKTYWNY DOK: SZEF / DYSPOZYTOR</p>
      </div>
    </div>

    <!-- PRZEŁĄCZNIK RÓL (RBAC) -->
    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="openRoleSelector()" id="btn-role-toggle" class="px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700 hover:border-emerald-500 text-xs font-orbitron font-bold text-gray-300 transition">
        <i class="fa-solid fa-repeat text-amber-400 mr-1"></i> ROLA: <span id="role-name-display" class="text-emerald-400">SZEF</span>
      </button>
    </div>

    <!-- PASKI NAWIGACJI -->
    <nav class="flex gap-1 overflow-x-auto w-full lg:w-auto pb-1 lg:pb-0">
      <button onclick="switchTab('planner')" id="tab-planner" class="tab-btn boss-only dispatcher-only active px-3 py-2 rounded-xl border border-slate-800 text-xs font-orbitron flex items-center gap-1.5 transition">
        <i class="fa-solid fa-map-location-dot text-emerald-400"></i> PLANOWANIE TRAS
      </button>
      <button onclick="switchTab('driver-tasks')" id="tab-driver-tasks" class="tab-btn driver-only px-3 py-2 rounded-xl border border-slate-800 text-xs font-orbitron flex items-center gap-1.5 transition">
        <i class="fa-solid fa-list-check text-emerald-400"></i> MOJA TRASA (DRIVER)
      </button>
      <button onclick="switchTab('fleet')" id="tab-fleet" class="tab-btn px-3 py-2 rounded-xl border border-slate-800 text-xs font-orbitron flex items-center gap-1.5 transition">
        <i class="fa-solid fa-truck text-blue-400"></i> FLOTA & SERWIS
      </button>
      <button onclick="switchTab('tacho')" id="tab-tacho" class="tab-btn px-3 py-2 rounded-xl border border-slate-800 text-xs font-orbitron flex items-center gap-1.5 transition">
        <i class="fa-solid fa-stopwatch text-amber-400"></i> TACHO & MAPA GPS
      </button>
      <button onclick="switchTab('cmr')" id="tab-cmr" class="tab-btn px-3 py-2 rounded-xl border border-slate-800 text-xs font-orbitron flex items-center gap-1.5 transition">
        <i class="fa-solid fa-file-signature text-purple-400"></i> CYFROWE e-CMR
      </button>
    </nav>
  </header>

  <!-- GŁÓWNA PRZESTRZEŃ MODUŁOWA -->
  <main class="flex-grow">
    <section id="sec-planner" class="boss-only dispatcher-only space-y-3"></section>
    <section id="sec-driver-tasks" class="driver-only hidden space-y-3"></section>
    <section id="sec-fleet" class="hidden space-y-3"></section>
    <section id="sec-tacho" class="hidden space-y-3"></section>
    <section id="sec-cmr" class="hidden space-y-3"></section>
  </main>

  <!-- SKRYPTY MODUŁOWE -->
  <script src="app.js"></script>
  <script src="routes.js"></script>
  <script src="tacho.js"></script>
  <script src="fleet.js"></script>
  <script src="cmr.js"></script>
</body>
</html>
